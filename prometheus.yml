global:
  scrape_interval: 5s # 🧠 OPTIMIZED: Aggressive 5s polling intervals to catch rapid local stress tests
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "job-orchestrator-cluster"
    metrics_path: "/metrics"
    static_configs:
      # Targets your orchestrator containers across the isolated internal docker network bridge
      - targets: ["orchestrator:8080"]
